[project]
name = "conformal-fault-inference-with-abstention"
version = "0.1.0"
description = "Diagnóstico industrial con predicción conforme y abstención selectiva"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2.3",
    "scikit-learn>=1.6",
    "matplotlib>=3.10",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
torch = ["torch>=2.7"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
